spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:provana_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: WARN
    com.provana: DEBUG

razorpay:
  key-id: rzp_test_mockkeyid12345
  key-secret: test_secret_key_1234567890
  webhook-secret: test_webhook_secret_1234567890
  currency: INR
  enabled: true
